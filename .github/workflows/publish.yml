name: 2 · Posten

on:
  schedule:
    - cron: "5,35 5-20 * * *"   # alle 30 Min. tagsüber – das Script entscheidet, ob ein Slot dran ist
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort den nächsten Post veröffentlichen"
        type: boolean
        default: false
      dry_run:
        description: "Nur testen, nichts posten"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Nächsten Post veröffentlichen (falls Slot erreicht)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m autopilot.publish $ARGS
      - name: Cockpit aktualisieren (nur wenn gepostet wurde)
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_IG: ${{ secrets.IG_ACCESS_TOKEN != '' }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          if [ -n "$(git status --porcelain queue posted data)" ]; then python -m autopilot.cockpit; fi
      - name: Änderungen speichern
        run: |
          git config user.name "insta-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue posted data docs
          git diff --cached --quiet || (git commit -m "Post veröffentlicht" && git push)
