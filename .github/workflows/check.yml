name: 0 · Verbindung testen

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Instagram-Token prüfen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m autopilot.token_tools whoami
      - name: Claude-Key vorhanden?
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: '[ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY ist gesetzt" || (echo "::error::ANTHROPIC_API_KEY fehlt"; exit 1)'
