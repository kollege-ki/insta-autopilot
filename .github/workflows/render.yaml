name: 7 · Slides neu rendern

# Rendert alle wartenden Posts in queue/ mit dem aktuellen Design neu –
# z. B. nach einer Änderung an render.py oder an den Farben in config.yaml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Slides neu rendern
        run: python -m autopilot.render --queue
      - name: Änderungen speichern
        run: |
          git config user.name "insta-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue
          git diff --cached --quiet || (git commit -m "Slides neu gerendert" && git push)
