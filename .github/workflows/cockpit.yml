name: 6 · Cockpit aktualisieren

# Baut das Cockpit neu, sobald sich etwas tut: Freigabe gemergt, Journal/Config geändert,
# neuer Freigabe-PR geöffnet – oder per Knopfdruck.
on:
  push:
    branches: [main]
    paths: ["queue/**", "content/**", "config.yaml"]
  pull_request:
    types: [opened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Meilensteine erfassen und Cockpit bauen
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_IG: ${{ secrets.IG_ACCESS_TOKEN != '' }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          python -c "from autopilot.stats import update_milestones; from autopilot.common import load_config; update_milestones(load_config())"
          python -m autopilot.cockpit
      - name: Änderungen speichern
        run: |
          git config user.name "insta-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || (git commit -m "Cockpit aktualisiert" && git push)
